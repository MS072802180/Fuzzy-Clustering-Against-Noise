# The earlier small-data suite (scikit-learn-bundled UCI sets + small synthetic). ~40 min on 2 cores.
out_dir: results/small
seeds: 10
jobs: -1                      # -1 = all CPU cores
datasets: [S1_2d_unequal, S2_10d_blobs, iris, wine, breast_cancer, digits]
noise_types: [uniform, heavy, rowwise, cellwise]
levels: [0.0, 0.05, 0.10, 0.20]          # contamination level r
methods: [FCM, PFCM, NC, GMM, GMM+noise, t-mixture, AE+FCM, ST-RNC]
method_params:                # defaults are the canonical settings from each method's original publication
  FCM:       {m: 2.0}
  PFCM:      {m: 2.0, eta: 2.0, a: 1.0, b: 1.0}
  NC:        {m: 2.0, lam: 0.5}  # lam tuned on the synthetic S1 data only
  t-mixture: {estimate_nu: true}
  AE+FCM:    {epochs: 150, m: 2.0}
  ST-RNC:    {m_grid: [1.2, 1.5, 2.0], q: 0.99, rule: xb}   # proposed model; fixed on the development suite
ablation:                     # PFCM parameter grid and label-free selection
  level: 0.10
  seeds: 5
  m:   [1.1, 1.3, 1.5, 2.0, 3.0]
  eta: [1.5, 2.0, 3.0, 4.0]
  ab:  [[1.0, 1.0], [1.0, 3.0], [3.0, 1.0]]
  # number-of-clusters sweep (c = true c + offset), on clean data and the noise types below
  c_offsets: [-2, -1, 0, 1, 2]
  c_methods: [FCM, PFCM, NC, GMM, GMM+noise, ST-RNC]
  c_noise:   [none, uniform]
  # component ablation of the proposed ST-RNC (same conditions and seeds as the main run)
  components: [NC, RNC, ST-NC, ST-RNC]
  c_seeds:   5
diagnostics:
  heatmap: iris
  outliers: iris
  partitions: [iris, wine]
  convergence: [iris, wine]
  ae_latent: wine
